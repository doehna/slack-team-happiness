spring:
  application:
    name: slack-team-happiness

logging.level:
  org.springframework: INFO
  com.slack.api: INFO

slack:
  signing-secret: ${SLACK_SIGNING_SECRET}
  bot:
    token: ${SLACK_BOT_TOKEN}
  app:
    token: ${SLACK_APP_TOKEN}
  test-user-id: ${SLACK_TEST_USER_ID:}
  groups:
    - name: "Engineering"
      slack-group-id: ${SLACK_TEAM_GROUP_ID:}
      google-sheet-name: ${ENGINEERING_SHEET_NAME:}
    - name: "Product"
      slack-group-id: ${SLACK_PRODUCT_TEAM_GROUP_ID:}
      google-sheet-name: ${PRODUCT_SHEET_NAME:}
    - name: "Other"
      slack-group-id: ""
      google-sheet-name: ${OTHER_SHEET_NAME:}
google:
  spreadsheet-id: ${SPREADSHEET_ID:}
  application-name: ${GOOGLE_APPLICATION_NAME:}
  credential-file-path: ${GOOGLE_CREDENTIALS_FILE_PATH:}

schedule:
  cron: ${SCHUDULE_TIME:0 30 14 * * FRI}
